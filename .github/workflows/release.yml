name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Get version from tag
        id: version
        shell: pwsh
        run: echo "value=$('${{ github.ref_name }}'.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - name: Publish
        run: dotnet publish GitSparseManager.csproj -c Release -r win-x64 --self-contained false -p:Version=${{ steps.version.outputs.value }} -o publish

      - name: Install vpk
        run: dotnet tool install -g vpk

      - name: Download previous releases (for delta packages)
        run: vpk download github --repoUrl https://github.com/${{ github.repository }}

      - name: Pack
        run: vpk pack -u GitSparseManager -v ${{ steps.version.outputs.value }} -p publish --mainExe GitSparseManager.exe --framework net8.0-x64-desktop

      - name: Upload to GitHub Release
        run: vpk upload github --repoUrl https://github.com/${{ github.repository }} --publish --releaseName "GitSparseManager ${{ steps.version.outputs.value }}" --tag v${{ steps.version.outputs.value }} --token ${{ secrets.GITHUB_TOKEN }}
