name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, MAJOR.MINOR.PATCH without "v" (e.g. 2.4.2)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Manual runs build main; tag pushes build the tagged commit.
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || '' }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Determine version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = $env:INPUT_VERSION
          } else {
            $version = '${{ github.ref_name }}'.TrimStart('v')
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "Version '$version' is not MAJOR.MINOR.PATCH."
            exit 1
          }
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $existing = git ls-remote --tags origin "refs/tags/v$version"
            if ($existing) {
              Write-Error "Tag v$version already exists."
              exit 1
            }
          }
          echo "value=$version" >> $env:GITHUB_OUTPUT

      - name: Publish
        run: dotnet publish GitCheckoutManager.csproj -c Release -r win-x64 --self-contained false -p:Version=${{ steps.version.outputs.value }} -o publish

      # The vpk tool version must be bumped together with the Velopack package
      # version in GitCheckoutManager.csproj.
      - name: Install vpk
        run: dotnet tool install -g vpk --version 1.2.161

      - name: Download previous releases (for delta packages)
        run: vpk download github --repoUrl https://github.com/${{ github.repository }}

      - name: Pack
        run: vpk pack -u GitCheckoutManager --packTitle "Git Checkout Manager" -v ${{ steps.version.outputs.value }} -p publish --mainExe GitCheckoutManager.exe --framework net8.0-x64-desktop

      - name: Upload to GitHub Release
        run: vpk upload github --repoUrl https://github.com/${{ github.repository }} --publish --releaseName "Git Checkout Manager ${{ steps.version.outputs.value }}" --tag v${{ steps.version.outputs.value }} --token ${{ secrets.GITHUB_TOKEN }}
